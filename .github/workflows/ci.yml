name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Added comments
        if: github.event_name == 'pull_request'
        env:
          COMMENTS_BASE: ${{ github.event.pull_request.base.sha }}
          COMMENTS_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$COMMENTS_BASE" "$COMMENTS_HEAD")
          bun run lint:comments --base "$base" --head "$COMMENTS_HEAD"
      - run: bun run typecheck
      - run: bun run test:harness

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run audit

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elysium_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d elysium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elysium_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      APP_URL: http://127.0.0.1:3100
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Validate migrations on a fresh database
        run: bun run --cwd packages/backend db:migrate
      - run: bun run --cwd packages/backend test

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/web test
      - run: bun run build

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elysium_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d elysium_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elysium_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elysium_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      APP_URL: http://127.0.0.1:3100
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/backend db:migrate
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  images:
    needs: [lint, audit, test-backend, test-web, test-e2e]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
