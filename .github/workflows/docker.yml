name: Docker images

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: packages/web/Dockerfile
            target: runtime
          - name: migrate
            file: packages/web/Dockerfile
            target: migrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require the production public origin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: test -n "$PUBLIC_APP_URL"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/elysium-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          tags: elysium-${{ matrix.name }}:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SITE_URL=${{ vars.PUBLIC_APP_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke the built image
        env:
          IMAGE: elysium-${{ matrix.name }}:smoke
          IMAGE_KIND: ${{ matrix.name }}
        run: bash scripts/smoke-image.sh
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: elysium-${{ matrix.name }}:smoke
        run: docker save "$IMAGE" --output "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: smoke-image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }} image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [web, migrate]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smoke-image-${{ matrix.name }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/elysium-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Publish the tested image
        env:
          IMAGE: elysium-${{ matrix.name }}:smoke
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          while IFS= read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
