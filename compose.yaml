services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: myapp
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --host 127.0.0.1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migrate:
    profiles: [tools]
    image: ${MIGRATION_IMAGE:-elysium-migrate:local}
    environment:
      DATABASE_URL: postgresql://postgres:localpassword@postgres:5432/myapp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: elysium-postgres-data
