services:
  - type: web
    name: elysium
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./packages/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    preDeployCommand: bun /app/migrate/migrate.mjs
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - infra/**
        - docs/**
        - "**/*.md"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elysium-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: VITE_SITE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BETTER_STACK_SOURCE_TOKEN
        sync: false
      - key: BETTER_STACK_INGESTING_HOST
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: OTEL_SERVICE_NAME
        value: elysium

databases:
  - name: elysium-db
    databaseName: elysium
    user: elysium
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
